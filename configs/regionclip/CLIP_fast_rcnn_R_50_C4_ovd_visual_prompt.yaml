# Visual Prompt Fine-tuning for RegionCLIP: the unified feature-space prompt.
# The solver block below is the few-shot ODinW setting (40 epochs, constant LR);
# the prompt itself is attached in the training entry point via
# regionclip_visual_prompt.py, which also freezes every other parameter.
# Copy this file per dataset and edit NUM_CLASSES / DATASETS / MAX_ITER.
_BASE_: ../COCO-InstanceSegmentation/CLIP_fast_rcnn_R_50_C4_ovd.yaml
MODEL:
  ROI_HEADS:
    NUM_CLASSES: 7
DATASETS:
  TRAIN:
  - Aquarium_shot5_seed300
  TEST:
  - Aquarium_test
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.002
  STEPS: (12000, 16000)
  MAX_ITER: 88
  WARMUP_ITERS: 9
  CLIP_GRADIENTS:
    ENABLED: true
  AMP:
    ENABLED: true
